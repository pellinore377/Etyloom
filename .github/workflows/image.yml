name: Publish container
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ghcr.io/pellinore377/etyloom
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: docker/setup-buildx-action@v3
      - name: Build exact verified revision
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: etyloom:candidate
          labels: |
            org.opencontainers.image.source=https://github.com/pellinore377/Etyloom
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
      - name: Exercise the production container
        run: bash scripts/container-smoke.sh etyloom:candidate
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        run: |
          docker tag etyloom:candidate "$IMAGE:sha-$SOURCE_SHA-${{ matrix.arch }}"
          docker push "$IMAGE:sha-$SOURCE_SHA-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-${{ matrix.arch }}
          path: |
            container.log
            container-wasm.headers
          retention-days: 7
  manifest:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ghcr.io/pellinore377/etyloom
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifest
        run: |
          docker buildx imagetools create --tag "$IMAGE:sha-$SOURCE_SHA" \
            "$IMAGE:sha-$SOURCE_SHA-amd64" "$IMAGE:sha-$SOURCE_SHA-arm64"
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" = "$SOURCE_SHA" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:sha-$SOURCE_SHA"
            echo "Published $IMAGE:latest from $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published immutable SHA tag only; main advanced during the build." >> "$GITHUB_STEP_SUMMARY"
          fi
          docker buildx imagetools inspect "$IMAGE:sha-$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Check anonymous access
        run: |
          export DOCKER_CONFIG=$(mktemp -d)
          if docker pull "$IMAGE:sha-$SOURCE_SHA"; then
            echo 'Anonymous pulls verified.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The image is published but private. Its owner must change the GHCR package visibility to public for credential-free Dockge pulls.' >> "$GITHUB_STEP_SUMMARY"
          fi
