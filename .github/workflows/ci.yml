name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Resolve and format the initial workspace
        if: github.event_name == 'push'
        run: |
          cargo generate-lockfile
          cargo fmt --all
          git add Cargo.lock crates
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: lock dependencies and format Rust [skip ci]'
            git push
          fi
      - run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked 2>&1 | tee test.log
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy.log
      - name: Benchmark
        run: cargo run --release --locked -p etyloom-cli -- bench 4096 5 2>&1 | tee benchmark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            *.log
            Cargo.lock
            crates/
          retention-days: 7
