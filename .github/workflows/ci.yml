name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Normalize initial source
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python3 .github/normalize.py
          cargo fmt --all
          git add crates style
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: preserve scope and normalize Rust source [skip ci]'
            git push
          fi
      - run: cargo fmt --all -- --check
      - name: Test engine
        run: |
          set -euo pipefail
          cargo test -p etyloom-engine --locked 2>&1 | tee engine-tests.log
      - name: Check server
        if: always()
        run: |
          set -euo pipefail
          cargo check -p etyloom-web --features ssr --locked 2>&1 | tee server.log
      - name: Check browser
        if: always()
        run: |
          set -euo pipefail
          cargo check -p etyloom-web --lib --features hydrate --target wasm32-unknown-unknown --locked 2>&1 | tee browser.log
      - name: Test server
        if: always()
        run: |
          set -euo pipefail
          cargo test -p etyloom-web --features ssr --locked 2>&1 | tee api-tests.log
      - name: Lint
        if: always()
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --features etyloom-web/ssr --locked -- -D warnings 2>&1 | tee clippy.log
      - name: Benchmark
        if: always()
        run: |
          set -euo pipefail
          cargo run --release --locked -p etyloom-cli -- bench 4096 5 2>&1 | tee benchmark.log
      - name: Build local stylesheet
        run: npm ci && npm run css
      - name: Install Leptos build tool
        run: cargo install cargo-leptos --version 0.3.7 --locked
      - name: Build server and WASM
        run: |
          set -euo pipefail
          cargo leptos build 2>&1 | tee application-build.log
      - name: Browser tests
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:browser 2>&1 | tee browser-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            *.log
            Cargo.lock
            Cargo.toml
            package-lock.json
            crates/
            style/
            target/site/
            target/debug/etyloom-web
            target/release/etyloom
            test-results/
            playwright-report/
          retention-days: 7
