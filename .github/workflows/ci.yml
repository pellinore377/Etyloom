name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-leptos
          key: leptos-0.3.7-${{ runner.os }}-${{ runner.arch }}
      - run: cargo fmt --all -- --check
      - name: Test engine
        run: cargo test -p etyloom-engine --locked
      - name: Test server
        run: cargo test -p etyloom-web --features ssr --locked
      - name: Check browser
        run: cargo check -p etyloom-web --lib --features hydrate --target wasm32-unknown-unknown --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --features etyloom-web/ssr --locked -- -D warnings
      - name: Benchmark
        run: cargo run --release --locked -p etyloom-cli -- bench 4096 20
      - name: Build local stylesheet
        run: npm ci && npm run css
      - name: Install Leptos build tool
        run: command -v cargo-leptos || cargo install cargo-leptos --version 0.3.7 --locked
      - name: Build server and WASM
        run: cargo leptos build
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Require a clean checkout
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            test-results/
            playwright-report/
          retention-days: 7
