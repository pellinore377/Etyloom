name: Offline development tools
on:
  push:
    paths: [.github/workflows/offline-development.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: |
          cargo fetch --locked
          mkdir -p /tmp/burn-fetch/src
          printf '[package]\nname="burn-fetch"\nversion="0.0.0"\nedition="2024"\n[dependencies]\nburn={version="=0.21.0",default-features=false,features=["std","autodiff","flex","wgpu"]}\n' > /tmp/burn-fetch/Cargo.toml
          echo 'fn main() {}' > /tmp/burn-fetch/src/main.rs
          cargo fetch --manifest-path /tmp/burn-fetch/Cargo.toml
          mkdir -p /tmp/offline
          cp -a "$HOME/.rustup/toolchains/1.94.0-x86_64-unknown-linux-gnu" /tmp/offline/toolchain
          rm -rf /tmp/offline/toolchain/share/doc
          mkdir -p /tmp/offline/cargo
          cp -a "$HOME/.cargo/registry" /tmp/offline/cargo/registry
          cp /tmp/burn-fetch/Cargo.lock /tmp/offline/burn.lock
          tar --zstd -cf offline-tools.tar.zst -C /tmp/offline .
      - uses: actions/upload-artifact@v4
        with:
          name: offline-tools
          path: offline-tools.tar.zst
          compression-level: 0
          retention-days: 1
