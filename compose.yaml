services:
  etyloom:
    image: ${ETYLOOM_IMAGE:-ghcr.io/pellinore377/etyloom:latest}
    restart: unless-stopped
    ports:
      - "${ETYLOOM_BIND:-127.0.0.1}:${ETYLOOM_PORT:-8080}:3000"
    environment:
      BASE_URL: ${BASE_URL:?Set BASE_URL to the public HTTPS origin}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?Set the Pocket ID issuer URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set the Pocket ID client ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set the Pocket ID client secret}
      ETYLOOM_WORKERS: ${ETYLOOM_WORKERS:-1}
      RUST_LOG: ${RUST_LOG:-info,tower_http=warn}
    volumes:
      - etyloom_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: ${ETYLOOM_CPUS:-4}
    mem_limit: ${ETYLOOM_MEMORY:-4g}
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  etyloom_data:
