[workspace]
members = ["crates/core", "crates/engine", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
