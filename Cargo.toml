[workspace]
members = ["crates/core", "crates/engine", "crates/cli", "crates/web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"

[[workspace.metadata.leptos]]
name = "etyloom"
bin-package = "etyloom-web"
lib-package = "etyloom-web"
output-name = "etyloom"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "crates/web/public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
end2end-cmd = "npx playwright test"
