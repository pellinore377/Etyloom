services:
  trainer:
    build:
      context: ./services/neural
    volumes:
      - ./training:/data:ro
      - etyloom_models:/models
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 4

volumes:
  etyloom_models:
